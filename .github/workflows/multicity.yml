name: Multi-city collection

# Replaces the Colab catch-up notebook. Runs on GitHub's machines, so no browser,
# no Colab backend and no Drive mount can stop it. Monthly on its own; any time
# from the Actions tab (Run workflow).
#
# Outputs are CANDIDATE, UNVERIFIED workflow artifacts kept for 90 days. This repo
# is public, so signed-in GitHub users can download them; every file says
# CANDIDATE in its MANIFEST. Nothing here publishes a figure.
on:
  schedule:
    - cron: "41 21 1 * *"   # 21:41 UTC on the 1st = 03:11 IST on the 2nd
  workflow_dispatch:
    inputs:
      cities:
        description: "Comma-separated cities, or 'all'"
        default: "all"
      detour:
        description: "Also compute Phase 2a candidate Detour Index points"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      cities: ${{ steps.pick.outputs.cities }}
    steps:
      - id: pick
        run: |
          ALL='["hyderabad", "bengaluru", "chennai", "mumbai_mmr", "delhi_ncr", "pune", "kolkata", "ahmedabad", "amaravati", "guwahati_dispur", "patna", "raipur", "panaji", "gandhinagar", "chandigarh", "ranchi", "thiruvananthapuram", "bhopal", "imphal", "bhubaneswar", "jaipur", "agartala", "lucknow", "port_blair", "daman", "srinagar", "jammu", "kavaratti", "puducherry"]'
          IN="${{ github.event.inputs.cities || 'all' }}"
          if [ "$IN" = "all" ]; then echo "cities=$ALL" >> "$GITHUB_OUTPUT"
          else echo "cities=$(python3 -c "import json,sys;print(json.dumps([c.strip() for c in sys.argv[1].split(',') if c.strip()]))" "$IN")" >> "$GITHUB_OUTPUT"; fi

  # Fetch every GHSL tile ONCE, serially, and hand them to the city jobs through
  # actions/cache. The JRC server throttles parallel downloads; four cities failed
  # twice when each city job fetched its own tiles. Tiles are ~static (R2023A,
  # E2020), so the cache prefix is reused across runs and only gaps are refetched.
  ghsl:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180     # JRC is slow; tiles fetched so far are saved even if this times out
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt rasterio shapely

      - name: Restore GHSL tiles
        uses: actions/cache/restore@v4
        with:
          path: cache/ghsl
          key: ghsl-pop-e2020-r2023a-3ss-${{ github.run_id }}
          restore-keys: ghsl-pop-e2020-r2023a-3ss-

      - name: Prefetch GHSL tiles (serial)
        timeout-minutes: 170
        run: |
          for c in $(echo '${{ needs.plan.outputs.cities }}' | python3 -c "import json,sys;print(' '.join(json.load(sys.stdin)))"); do
            python tools/multicity_collect.py "$c" --cache cache/ghsl --prefetch-ghsl
          done
          ls -la cache/ghsl

      - name: Save GHSL tiles
        if: always()           # keep partial progress so a rerun resumes instead of starting over
        uses: actions/cache/save@v4
        with:
          path: cache/ghsl
          key: ghsl-pop-e2020-r2023a-3ss-${{ github.run_id }}

  collect:
    needs: [plan, ghsl]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false        # one city failing never stops the others
      max-parallel: 6         # was 4; run 40637057361 (29 cities) green in 40 min. Paces Geofabrik zone downloads, so stay polite: raise to 8 only after a green run at 6
      matrix:
        city: ${{ fromJson(needs.plan.outputs.cities) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y osmium-tool
          python -m pip install --upgrade pip
          pip install -r requirements.txt rasterio shapely

      - name: Restore GHSL tiles from the prefetch job
        uses: actions/cache/restore@v4
        with:
          path: cache/ghsl
          key: ghsl-pop-e2020-r2023a-3ss-${{ github.run_id }}
          restore-keys: ghsl-pop-e2020-r2023a-3ss-

      - name: Collect ${{ matrix.city }}
        run: |
          DETOUR="${{ github.event.inputs.detour || 'true' }}"
          FLAG=""; [ "$DETOUR" = "true" ] && FLAG="--detour"
          python tools/multicity_collect.py "${{ matrix.city }}" --out out --cache cache $FLAG --ghsl-cache cache/ghsl

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arcroad-${{ matrix.city }}-candidate
          path: out/
          retention-days: 90
          if-no-files-found: warn
