name: Deploy research runner

# Builds the research runner's container on GitHub's machines (they have Docker) and deploys it
# to Cloudflare, so the iMac and Docker Desktop are no longer needed. Runs when runner code or the
# pipeline it snapshots changes on main, or by hand from the Actions tab.
# Secrets (repo Settings > Secrets and variables > Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - "research/runner/**"
      - "pipeline/**"
      - "tools/runner_snapshot.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to deploy during a night run (22:00 to 06:00 IST)
        if: github.event_name == 'push'
        run: |
          h=$(TZ=Asia/Kolkata date +%H)
          if [ "$h" -ge 22 ] || [ "$h" -lt 6 ]; then
            echo "::error::Night run window. Re-run from the Actions tab after 06:00 IST."; exit 1
          fi

      - name: Bake the code snapshot into the image
        run: bash tools/runner_snapshot.sh

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        working-directory: research/runner
        run: npm ci || npm install

      - name: Deploy
        working-directory: research/runner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
