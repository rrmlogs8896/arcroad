name: Freshness

# Compliance as CI. Runs on every push and weekly on its own, so a page can go
# stale on the calendar without anyone touching the repo and still get caught.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verification dates
        run: python tools/check_freshness.py
