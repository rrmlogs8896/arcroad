# Free on any plan. Keeps the pinned toolchain current instead of letting it
# rot until a security advisory forces a scramble.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    # requirements.txt holds minimum versions (>=) on purpose. Only propose a
    # change when a new release falls outside that range, never a floor bump
    # (those failed CI and were closed: #3-#7).
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
